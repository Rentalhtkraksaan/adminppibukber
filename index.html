<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bukber PPI 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #ffcc00;
            --dark-bg: #06090f;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --accent-blue: #00d2ff;
            --danger: #ff4d4d;
            --success: #2ecc71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--dark-bg);
            background-image: radial-gradient(circle at 50% -20%, #1a2a44 0%, #06090f 100%);
            color: #e2e8f0; 
            padding: 16px;
            min-height: 100vh;
        }

        .container { max-width: 600px; margin: 0 auto; }

        header { text-align: left; margin: 20px 0 25px 5px; }
        header h1 { font-size: 1.4rem; color: #fff; font-weight: 800; }
        
        /* Digital Clock Style */
        .clock-wrapper {
            background: rgba(255, 255, 255, 0.05);
            display: inline-block;
            padding: 8px 15px;
            border-radius: 12px;
            margin-top: 10px;
            border: 1px solid var(--border);
        }
        #realtime-clock {
            font-family: monospace;
            font-weight: 700;
            color: var(--gold);
            font-size: 0.9rem;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .status-open { background: rgba(46, 204, 113, 0.15); color: var(--success); border: 1px solid var(--success); }
        .status-closed { background: rgba(255, 77, 77, 0.15); color: var(--danger); border: 1px solid var(--danger); }
        .status-soon { background: rgba(255, 204, 0, 0.15); color: var(--gold); border: 1px solid var(--gold); }

        /* Statistik Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 15px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .stat-card i { position: absolute; right: -5px; bottom: -5px; font-size: 2.5rem; opacity: 0.05; color: white; }
        .stat-card span { display: block; font-size: 0.65rem; color: #8892b0; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 0.5px; }
        .stat-card h2 { font-size: 1.3rem; font-weight: 800; }

        .full-width { grid-column: span 2; }
        .border-gold { border-left: 4px solid var(--gold); }
        .border-blue { border-left: 4px solid var(--accent-blue); }
        .border-green { border-left: 4px solid var(--success); }
        .border-white { border-left: 4px solid #fff; }

        /* List Data Style */
        .list-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 40px; }
        .user-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            animation: fadeIn 0.5s ease;
        }
        .user-card.duplicate { border: 1px solid rgba(255, 77, 77, 0.4); background: rgba(255, 77, 77, 0.05); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .user-info h4 { font-size: 1rem; font-weight: 700; color: #fff; }
        .user-info small { font-size: 0.75rem; color: #8892b0; }

        .badge {
            padding: 6px 10px; border-radius: 10px; font-size: 0.65rem; font-weight: 700;
        }
        .badge-ppi { background: rgba(0, 210, 255, 0.1); color: var(--accent-blue); }
        .badge-menu { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid var(--border); }

        .card-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .action-btn {
            height: 45px; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; border: none; font-size: 1.1rem;
        }
        .btn-view { background: var(--gold); color: #000; }
        .btn-wa { background: var(--success); color: #fff; }
        .btn-del { background: rgba(255, 77, 77, 0.1); color: var(--danger); border: 1px solid rgba(255, 77, 77, 0.2); }

        #modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        }
        #modal img { max-width: 100%; max-height: 80vh; border-radius: 15px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Panel Admin Bukber</h1>
        <div class="clock-wrapper">
            <div id="realtime-clock">Memuat waktu...</div>
        </div>
    </header>

    <div id="reg-status" class="status-badge">Memproses Status...</div>

    <div class="stats-grid">
        <div class="stat-card full-width border-blue">
            <i class="fas fa-users"></i>
            <span>Total Seluruh Peserta</span>
            <h2 id="t-semua">0</h2>
        </div>

        <div class="stat-card border-white">
            <i class="fas fa-drumstick-bite"></i>
            <span>MENU AYAM</span>
            <h2 id="t-ayam">0</h2>
        </div>
        <div class="stat-card border-white">
            <i class="fas fa-egg"></i>
            <span>MENU TELUR</span>
            <h2 id="t-telur">0</h2>
        </div>

        <div class="stat-card full-width border-green">
            <i class="fas fa-wallet"></i>
            <span>Total Dana Terkumpul</span>
            <h2 id="t-uang" style="color: var(--success);">Rp 0</h2>
        </div>
    </div>

    <div class="list-container" id="isi-tabel"></div>
</div>

<div id="modal">
    <span style="position:absolute; top:30px; right:30px; font-size:2rem; color:#fff; cursor:pointer;" onclick="closeImg()">&times;</span>
    <img id="img-target" src="">
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCtQh5SpZCk2TDUk9iMOjQX5uc6gRIJyp8",
        authDomain: "paskab-c3eb4.firebaseapp.com",
        databaseURL: "https://paskab-c3eb4-default-rtdb.firebaseio.com",
        projectId: "paskab-c3eb4",
        storageBucket: "paskab-c3eb4.firebasestorage.app",
        messagingSenderId: "630872087747",
        appId: "1:630872087747:web:dbe8eee722f2d0f6759676"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dataRef = ref(db, 'pendaftaran');

    // --- FUNGSI CLOCK & STATUS ---
    function updateClock() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        document.getElementById('realtime-clock').innerText = now.toLocaleDateString('id-ID', options);

        // Logika Status Pendaftaran
        const statusEl = document.getElementById('reg-status');
        const start = new Date('2026-02-09T17:00:00'); // 9 Feb jam 17:00
        const end = new Date('2026-02-25T23:59:59');   // 25 Feb jam 23:59

        if (now < start) {
            statusEl.className = "status-badge status-soon";
            statusEl.innerHTML = '<i class="fas fa-hourglass-start"></i> Segera Dibuka (9 Feb 17:00)';
        } else if (now >= start && now <= end) {
            statusEl.className = "status-badge status-open";
            statusEl.innerHTML = '<i class="fas fa-door-open"></i> Pendaftaran Dibuka';
        } else {
            statusEl.className = "status-badge status-closed";
            statusEl.innerHTML = '<i class="fas fa-door-closed"></i> Pendaftaran Ditutup';
        }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- FIREBASE LOGIC ---
    onValue(dataRef, (snapshot) => {
        let allData = [];
        if (snapshot.exists()) {
            snapshot.forEach((child) => {
                allData.push({ key: child.key, ...child.val() });
            });
            allData.reverse();
        }
        renderCards(allData);
        updateStats(allData);
    });

    function renderCards(data) {
        const container = document.getElementById('isi-tabel');
        container.innerHTML = "";
        data.forEach((d) => {
            const waktu = d.timestamp ? new Date(d.timestamp).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) : '--:--';
            let rawWA = d.whatsapp ? d.whatsapp.toString().replace(/\D/g, '') : '';
            let formattedWA = rawWA.startsWith('0') ? '62' + rawWA.substring(1) : rawWA;

            container.innerHTML += `
                <div class="user-card">
                    <div class="card-header">
                        <div class="user-info">
                            <h4>${d.nama}</h4>
                            <small>${waktu} • Angkatan ${d.angkatan}</small>
                        </div>
                        <span class="badge badge-ppi">PPI</span>
                    </div>
                    <div style="margin-bottom:15px"><span class="badge badge-menu">${d.menu}</span></div>
                    <div class="card-actions">
                        <button class="action-btn btn-view" onclick="showImg('${d.bukti}')"><i class="fa fa-image"></i></button>
                        <a href="https://wa.me/${formattedWA}" target="_blank" class="action-btn btn-wa"><i class="fab fa-whatsapp"></i></a>
                        <button class="action-btn btn-del" onclick="hapusData('${d.key}')"><i class="fa fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
    }

    function updateStats(data) {
        let ayam = data.filter(d => d.menu === "Ayam").length;
        let telur = data.filter(d => d.menu === "Telur").length;
        document.getElementById('t-semua').innerText = data.length;
        document.getElementById('t-ayam').innerText = ayam;
        document.getElementById('t-telur').innerText = telur;
        document.getElementById('t-uang').innerText = "Rp " + (data.length * 30000).toLocaleString('id-ID');
    }

    window.hapusData = (key) => {
        if (confirm("Hapus data ini?")) remove(ref(db, 'pendaftaran/' + key));
    };

    window.showImg = (src) => {
        document.getElementById('img-target').src = src;
        document.getElementById('modal').style.display = 'flex';
    };
    window.closeImg = () => { document.getElementById('modal').style.display = 'none'; };
</script>
</body>
</html>
